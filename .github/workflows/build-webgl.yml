name: Build WebGL

on:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "src/**"
      - "tools/**"
      - ".github/workflows/build-webgl.yml"
  workflow_dispatch:

concurrency:
  group: build-webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL (Unity 6.3 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Salin pustaka aturan ke Assets
        run: bash tools/sync-rules.sh

      - name: Build dengan game-ci
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.28f1
          targetPlatform: WebGL
          buildMethod: WeBoard.BuildTools.BuildScript.BuildWebGL
          versioning: None

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: WeBoard-WebGL
          path: build/WebGL
          retention-days: 14
